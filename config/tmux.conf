# * file: tmux.conf
# ##############################################################################
# ** metadata
# ******************************************************************************
# vim: ft=sh
# description: configuration for tmux behavior

# ** plugins | tpm manager
# ******************************************************************************
# *** plugins managed by tpm
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# set -g @plugin "arcticicestudio/nord-tmux"

# *** other examples
# ==============================================================================
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# *** initialize tmux plugin manager
# ==============================================================================
# **** launch tpm plugin manager
# keep this line at the very bottom of tmux.conf after the plugins are all defined
run '~/.tmux/plugins/tpm/tpm'

# *** automatic resurrection of tmux sessions on reboot
# ==============================================================================
# this piece of the code does not work for some reason
# set -g @continuum-boot 'on'

# ** plugins | manual
# ******************************************************************************
# *** session finder
# source-file ~/.tmux/plugins/session-finder/session-finder.conf

# ** plugins | private
# ******************************************************************************
# *** session finder
bind-key s display-popup -E -w 90% -h 80% "~/.tmux/scripts/ryadav-script-tmux-session_switcher-20251105.sh"

# *** group switcher (two-stage: group -> session)
bind-key g display-popup -E -w 90% -h 80% "~/.tmux/scripts/ryadav-script-tmux-group_manage-20260426.sh switch"

# ** setting | prefix
# ******************************************************************************
# *** change prefix to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# *** reload the file with prefix r.
bind r source-file ~/.tmux.conf \; display "[Success]: Tmux Configuration Reloaded!!"

# *** switch to previous session
bind-key b switch-client -l

# ** settings | common
# ******************************************************************************
# set -g default-path /home/rowhit/
# set-environment LANG en_US.utf8
# set-environment LC_COLLATE de_DE.utf8
#
# *** set delay between prefix and command
set -sg escape-time 1

# *** set delay between prefix and command
set -g detach-on-destroy off

# *** set delay between prefix and command
set -g display-time 2000

# *** set delay between prefix and command
set -g history-limit 10000

# *** set delay between prefix and command
set -g bell-action any

# *** set delay between prefix and command
set -g set-titles on
set -g set-titles-string "[$USER@#H]:[#S]"

# ** settings | shell
# ******************************************************************************
# set -g default-shell /usr/bin/bash
# set -g default-shell /usr/local/bin/bash # soft link to spack bash
# set -g default-shell /usr/local/bin/xonsh # soft link to spack xonsh

# set -g default-command /bin/bash
# set -g default-command "exec /bin/bash"

# set-option -g default-shell "/nix/store/w9a2xc1whf8w6k7b8dj7hsy8kvjvc8hq-xonsh-0.9.9/bin/xonsh"

# ** settings | windows
# ******************************************************************************
# *** creating new window
bind c new-window -c "#{pane_current_path}"

# *** windows navigating
unbind C-Left
unbind C-Right
bind -n C-Left select-window -t :-
bind -n C-Right select-window -t :+
bind -n S-Left swap-window -t -1\; select-window -t -1
bind -n S-Right swap-window -t +1\; select-window -t +1

# *** panes navigation
# **** open pane in zoom mode by default
set-hook -g after-split-window 'resize-pane -Z'
set-hook -g pane-focus 'if -F "#{window_zoomed_flag}" "resize-pane -Z"'

# **** move up and down in the panes using Ctrl + Up/Down arrow keys
unbind C-Up
unbind C-Down
# bind -n C-Up select-pane -U
# bind -n C-Down select-pane -D
bind -n C-Up if-shell -F '#{window_zoomed_flag}' 'select-pane -U; resize-pane -Z' 'select-pane -U'
bind -n C-Down if-shell -F '#{window_zoomed_flag}' 'select-pane -D; resize-pane -Z' 'select-pane -D'

# *** indexing/numbering
# set window base index to 1
set -g base-index 1

# *** renumber windows if any is closed
set-option -g renumber-windows on

# ** settings | panes
# ******************************************************************************
# *** splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# *** navigating
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# *** resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# *** maximize and restore
unbind Up
unbind Down
bind Up new-window -d -n tmp \; swap-pane -s tmp.1 \; select-window -t tmp
bind Down last-window \; swap-pane -s tmp.1 \; kill-window -t tmp

# *** index/numbering
# set pane base index to 1
set-window-option -g pane-base-index 1
#set-window-option -g status-left " #S "

# ** setting | log output to a text file on demand
# ******************************************************************************
bind P pipe-pane -o "cat >>~/#W.log" \; display "Toggled logging to ~/#W.log"

# ** settings | Mouse support
# set to on if you want to use the mouse.
# ******************************************************************************
# setw -g mode-mouse on
# set -g mouse-select-pane on
# set -g mouse-resize-pane on
# set -g mouse-select-window on

# ** setting | misc
# ******************************************************************************
# *** Set the default terminal mode to 256color mode.
set -g default-terminal "screen-256color"
# set -g default-terminal "xterm"
set -ag terminal-overrides ',screen*:cvvis=\E[34l\E[?25h'

## *** Enable activity alerts.
setw -g monitor-activity on
set -g visual-activity on
set -g automatic-rename on

## *** Pane colors.
#set -g pane-border-fg green
#set -g pane-border-bg black
#set -g pane-active-border-fg white
#set -g pane-active-border-bg yellow
#set -g pane-active-border-bg red

## *** Command / message line.
#set -g message-attr bold
#set -g message-bg colour255
#set -g message-fg colour0

# ** settings | enable vi keys
# ******************************************************************************
setw -g mode-keys vi
#bind -t vi-copy 'v' begin-selection
#bind -t vi-copy 'y' copy-selection
bind Escape copy-mode
unbind [
unbind p
bind p paste-buffer
#Copy and paste between tmux and x clipboard
bind C-p run-shell "tmux set-buffer \"$(xclip -o)\"; tmux paste-buffer"
bind C-y run-shell "tmux show-buffer | xclip -sel clip -i"

# Cmatrix
#set -g lock-server on
set -g lock-after-time 1800
set -g lock-command 'cmatrix -b -u 9'

# ** status bar
# ******************************************************************************
# *** status bar | update
# ==============================================================================
set -g status on
set -g status-interval 30
# set -g status-utf8 on
set -g status-justify "left"
set-window-option -g xterm-keys on

set -g status-fg colour0 #color options green, red
set -g status-bg colour255

# *** status bar | left side
# ==============================================================================
# show host name and IP address on left side of status bar
set -g status-left-length 100
# set -g status-left "#[fg=black]#S|#I:#P|"
# set -g status-left "#[fg=black]#S(#I:#P)|"
# set -g status-left "#[fg=black]#S(#I:#P)|"
set -g status-left "[#S]|[w:#I]|[p:#P/#{window_panes}]|"
#set -g status-left-fg colour0 #color options green, red

# *** status bar | right side
# ==============================================================================
# show session name, window & pan number, date and time on right side of status bar
set -g status-right-length 80
# set -g status-right "|$USER@#h|%A|%Y.%m.%d|%l:%M:%p "
# set -g status-right "|%A|%Y.%m.%d|%l:%M:%p "
# set -g status-right ""
# set -g status-right "|#[fg=black]$USER@#h|%A|%Y.%m.%d|%l:%M:%p "
# set -g status-right "|#{prefix_highlight}|#[fg=black]$USER@#h|%A|%Y.%m.%d|%l:%M:%p "
# set -g status-right "#[fg=green] #h | #[fg=blue]#S (#I:#P) #[fg=yellow] | %Y.%b.%d (%l:%M:%p ) | #[fg=green]#(date -u | awk '{print $4}')"
# set -g status-right '#[fg=green] #h | #(ip -4 -o addr show scope global | awk "{print \$4}" | cut -d/ -f1 | paste -sd " " -) | #[fg=blue]#S (#I:#P) #[fg=yellow] | %Y.%b.%d | %l:%M:%p'
# set -g status-right '#[fg=green] #h | #[fg=blue]#S (#I:#P) #[fg=yellow] | %Y.%b.%d (%l:%M:%p)'
set -g status-right '|#h|%Y.%b.%d|%l:%M %p '

#set -g status-right-fg colour0 #color options green, red
#set -g window-status-activity-attr bold
#set -g window-status-current-bg colour64
